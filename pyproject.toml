[project]
name = "reels-studio"
version = "0.1.0"
description = "Reels verticales a partir de crudos + referencia + instrucciones"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "scipy>=1.13",
    "playwright>=1.47",
    "imageio-ffmpeg>=0.5",
    "pydantic>=2.8",
    "pyloudnorm>=0.1.1",
    "fastapi>=0.142.1",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "pywebview>=6.2.1",
    "librosa>=0.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
reels = "engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders full video (regression)"]
